apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "dev.marasco.intently"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 114
        versionName "v6.9.17"

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Stable signing for CI builds: when INTENTLY_KEYSTORE_FILE is set (see
    // .github/workflows/build.yml), all builds are signed with one persistent
    // keystore so APKs can update over each other instead of forcing reinstalls.
    def ciKeystore = System.getenv("INTENTLY_KEYSTORE_FILE")
    def ciSigningOk = ciKeystore != null && file(ciKeystore).exists()
        && System.getenv("INTENTLY_KEYSTORE_PASSWORD") != null
        && System.getenv("INTENTLY_KEY_ALIAS") != null
        && System.getenv("INTENTLY_KEY_PASSWORD") != null
    signingConfigs {
        if (ciSigningOk) {
            ci {
                storeFile file(ciKeystore)
                storePassword System.getenv("INTENTLY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("INTENTLY_KEY_ALIAS")
                keyPassword System.getenv("INTENTLY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ciSigningOk) signingConfig signingConfigs.ci
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ciSigningOk) signingConfig signingConfigs.ci
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
}

dependencies {
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
}
