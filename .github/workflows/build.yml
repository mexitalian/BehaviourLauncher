name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          INTENTLY_KEYSTORE_BASE64: ${{ secrets.INTENTLY_KEYSTORE_BASE64 }}
          INTENTLY_KEYSTORE_PASSWORD: ${{ secrets.INTENTLY_KEYSTORE_PASSWORD }}
          INTENTLY_KEY_ALIAS: ${{ secrets.INTENTLY_KEY_ALIAS }}
          INTENTLY_KEY_PASSWORD: ${{ secrets.INTENTLY_KEY_PASSWORD }}
        run: |
          if [ -n "$INTENTLY_KEYSTORE_BASE64" ]; then
            printf '%s' "$INTENTLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/intently.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/intently.keystore" -storepass "$INTENTLY_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Keystore decoded but store password check failed."
              exit 1
            fi
            echo "INTENTLY_KEYSTORE_FILE=$RUNNER_TEMP/intently.keystore" >> "$GITHUB_ENV"
            echo "INTENTLY_KEYSTORE_PASSWORD=$INTENTLY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTENTLY_KEY_ALIAS=$INTENTLY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTENTLY_KEY_PASSWORD=$INTENTLY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable signing keystore restored and verified."
          else
            echo "No signing secret set; using default debug signing."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intently-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  publish-debug:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          INTENTLY_KEYSTORE_BASE64: ${{ secrets.INTENTLY_KEYSTORE_BASE64 }}
          INTENTLY_KEYSTORE_PASSWORD: ${{ secrets.INTENTLY_KEYSTORE_PASSWORD }}
          INTENTLY_KEY_ALIAS: ${{ secrets.INTENTLY_KEY_ALIAS }}
          INTENTLY_KEY_PASSWORD: ${{ secrets.INTENTLY_KEY_PASSWORD }}
        run: |
          if [ -n "$INTENTLY_KEYSTORE_BASE64" ]; then
            printf '%s' "$INTENTLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/intently.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/intently.keystore" -storepass "$INTENTLY_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Keystore decoded but store password check failed."
              exit 1
            fi
            echo "INTENTLY_KEYSTORE_FILE=$RUNNER_TEMP/intently.keystore" >> "$GITHUB_ENV"
            echo "INTENTLY_KEYSTORE_PASSWORD=$INTENTLY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTENTLY_KEY_ALIAS=$INTENTLY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTENTLY_KEY_PASSWORD=$INTENTLY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable signing keystore restored and verified."
          else
            echo "No signing secret set; using default debug signing."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Intently-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          prerelease: true
          files: Intently-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          INTENTLY_KEYSTORE_BASE64: ${{ secrets.INTENTLY_KEYSTORE_BASE64 }}
          INTENTLY_KEYSTORE_PASSWORD: ${{ secrets.INTENTLY_KEYSTORE_PASSWORD }}
          INTENTLY_KEY_ALIAS: ${{ secrets.INTENTLY_KEY_ALIAS }}
          INTENTLY_KEY_PASSWORD: ${{ secrets.INTENTLY_KEY_PASSWORD }}
        run: |
          if [ -n "$INTENTLY_KEYSTORE_BASE64" ]; then
            printf '%s' "$INTENTLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/intently.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/intently.keystore" -storepass "$INTENTLY_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Keystore decoded but store password check failed."
              exit 1
            fi
            echo "INTENTLY_KEYSTORE_FILE=$RUNNER_TEMP/intently.keystore" >> "$GITHUB_ENV"
            echo "INTENTLY_KEYSTORE_PASSWORD=$INTENTLY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTENTLY_KEY_ALIAS=$INTENTLY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTENTLY_KEY_PASSWORD=$INTENTLY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable signing keystore restored and verified."
          else
            echo "No signing secret set; using default debug signing."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: intently-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
